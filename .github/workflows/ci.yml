name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devops_inventory_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d devops_inventory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: devops_inventory_test
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ci_test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="devops_inventory_test",
              user="app_user",
              password="ci_test_password",
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      Path("migrations/001_create_inventory_items.sql").read_text()
                  )
          PY

      - name: Run lint checks
        run: ruff check app tests

      - name: Run Bandit security scan
        run: bandit -r app -ll

      - name: Run tests
        run: python -m pytest -v
